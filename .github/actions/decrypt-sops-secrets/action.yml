name: Decrypt SOPS secrets
description: >
  Checks out one dotenv file from a ci-secrets-style repo (public or private —
  pass repo-token for private), decrypts it with age via sops, masks every
  value in the log, and exports it into GITHUB_ENV for later steps to consume.

inputs:
  secrets-repo:
    description: owner/repo holding the encrypted files, e.g. KameshEas/ci-secrets
    required: true
  secrets-file:
    description: File name within that repo, e.g. cashlyze.env
    required: true
  ref:
    description: Branch/tag/sha of the secrets repo to check out
    required: false
    default: master
  age-key:
    description: The AGE-SECRET-KEY-... value (pass secrets.SOPS_AGE_KEY)
    required: true
  repo-token:
    description: >
      Fine-grained PAT with Contents: Read on secrets-repo. Required when that
      repo is private — the job's own GITHUB_TOKEN can't reach a different
      repo, even under the same account. Leave empty for a public repo.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout encrypted secrets
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.secrets-repo }}
        ref: ${{ inputs.ref }}
        path: .ci-secrets
        token: ${{ inputs.repo-token || github.token }}

    - name: Install sops
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v sops >/dev/null 2>&1; then
          SOPS_VERSION="v3.13.3"
          curl -sSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x /tmp/sops
          mkdir -p "$HOME/.local/bin"
          mv /tmp/sops "$HOME/.local/bin/sops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Decrypt and export (masked)
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.age-key }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"

        FILE=".ci-secrets/${{ inputs.secrets-file }}"
        if [ ! -f "$FILE" ]; then
          echo "❌ ${{ inputs.secrets-file }} not found in ${{ inputs.secrets-repo }}@${{ inputs.ref }}"
          exit 1
        fi

        while IFS= read -r line; do
          # Strip a trailing \r in case the plaintext source had CRLF line endings
          # (e.g. saved from Notepad/PowerShell on Windows) — bash's read only
          # splits on \n, so a stray \r would otherwise end up baked into the value.
          line="${line%$'\r'}"
          case "$line" in
            ''|'#'*) continue ;;
          esac
          key="${line%%=*}"
          value="${line#*=}"
          echo "::add-mask::${value}"
          echo "${key}=${value}" >> "$GITHUB_ENV"
        done < <(sops -d "$FILE")

        echo "✅ Decrypted ${{ inputs.secrets-file }} and exported its keys (values masked in logs)."
