name: Flutter Release (reusable)

# Flow:
#   pull_request -> Firebase App Distribution only (any version is fine, this is
#     a disposable testing build for the reviewer, not a shipped artifact).
#   push (i.e. the PR merged) -> the real release: version increments exactly
#     once here, then Play Store (internal on dev-branch, production on
#     prod-branch).
# Shorebird OTA patching is NOT part of this workflow -- it's a separate,
# manually-triggered action (flutter-shorebird-patch.yml) because deciding
# whether a change is Dart-only-safe to patch is a human judgment call, not
# something safe to infer from git state.

on:
  workflow_call:
    inputs:
      keystore-filename:
        description: Filename to decode the release keystore as, under android/app/ (e.g. everwith-release.jks)
        type: string
        required: true
      dev-branch:
        description: Branch whose merges trigger a Play Store internal-track release
        type: string
        default: development
      prod-branch:
        description: Branch whose merges trigger a Play Store production-track release
        type: string
        default: prod
      enable-shorebird:
        description: Register each Play Store release with Shorebird (shorebird release android) so it becomes OTA-patchable later
        type: boolean
        default: false
      enable-firebase-distribution:
        type: boolean
        default: false
      enable-play-store:
        type: boolean
        default: false
      play-track:
        description: Play Console track used for the dev-branch deploy (prod-branch always deploys to "release")
        type: string
        default: internal
      artifact-prefix:
        description: Prefix used for uploaded build artifacts, e.g. the app name
        type: string
        required: true
      ensure-env-file:
        description: >
          Copy .env.example to .env (or create an empty .env) before any build/test
          step. Set true for apps using flutter_dotenv with .env declared as a
          pubspec.yaml asset — otherwise flutter build/test fails with
          "No file or variants found for asset: .env".
        type: boolean
        default: false
      enable-auto-versioning:
        description: >
          Resolve version + build number from repo Variables instead of pubspec.yaml,
          auto-incrementing them on every merge (patch rolls into minor after 10,
          minor into major after 9). Requires secrets.VARS_PAT.
        type: boolean
        default: false
      version-variable:
        description: Repo Variable name holding MAJOR.MINOR.PATCH (only used when enable-auto-versioning)
        type: string
        default: ANDROID_VERSION
      build-number-variable:
        description: Repo Variable name holding the integer build number (only used when enable-auto-versioning)
        type: string
        default: ANDROID_BUILD_NUMBER
      enable-sops-secrets:
        description: >
          Source ANDROID_*/SHOREBIRD_TOKEN/FIREBASE_*/GCLOUD_*/PACKAGE_NAME from a
          SOPS-encrypted dotenv file in sops-secrets-repo instead of this repo's own
          GitHub Secrets. Requires secrets.SOPS_AGE_KEY. See gha-templates README.
        type: boolean
        default: false
      sops-secrets-repo:
        description: owner/repo holding the encrypted per-app dotenv files
        type: string
        default: KameshEas/ci-secrets
      sops-secrets-file:
        description: File name within sops-secrets-repo for this app, e.g. cashlyze.env
        type: string
        default: ""
      sops-secrets-ref:
        description: Branch/tag/sha of sops-secrets-repo to check out
        type: string
        default: master
      no-tree-shake-icons:
        description: >
          Pass --no-tree-shake-icons to every flutter build invocation. Needed
          by apps with non-constant IconData lookups (icon values computed at
          runtime, e.g. from an enum) -- Flutter's icon tree-shaker can't
          resolve those at compile time and the release build fails outright
          without this. See the app's own CLAUDE.md/docs for its specific
          known non-const usages before assuming this is needed.
        type: boolean
        default: false
      enable-google-services-json:
        description: >
          Write secrets.GOOGLE_SERVICES_JSON to android/app/google-services.json
          before any Gradle build step. Only needed for apps whose copy of that
          file is gitignored rather than committed (Cashlyze commits its own,
          so doesn't need this) -- the Google Services Gradle plugin fails the
          build outright if the file isn't present at all.
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      SHOREBIRD_TOKEN:
        required: false
      FIREBASE_ANDROID_APP_ID:
        required: false
      FIREBASE_SERVICE_ACCOUNT_CREDENTIALS:
        required: false
      FIREBASE_DISTRIBUTION_GROUPS:
        required: false
      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:
        required: false
      PACKAGE_NAME:
        required: false
      VARS_PAT:
        description: Fine-grained PAT with "Variables Read and write" on this repo, required when enable-auto-versioning is true
        required: false
      SOPS_AGE_KEY:
        description: age private key (AGE-SECRET-KEY-...) that decrypts sops-secrets-file, required when enable-sops-secrets is true
        required: false
      CI_SECRETS_REPO_TOKEN:
        description: Fine-grained PAT with Contents:Read on sops-secrets-repo, required when enable-sops-secrets is true and that repo is private
        required: false
      GOOGLE_SERVICES_JSON:
        description: Contents of android/app/google-services.json, required when enable-google-services-json is true
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves and persists the next version/build-number pair from repo Variables.
  # Only runs on push (i.e. a merge) -- this is the one and only point where the
  # version advances. PR-time Firebase builds intentionally reuse whatever's
  # already in pubspec.yaml; Firebase doesn't care what version label a testing
  # build carries.
  resolve_version:
    name: resolve_version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: version-resolve-${{ github.repository }}
      cancel-in-progress: false
    if: |
      inputs.enable-auto-versioning && github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', inputs.dev-branch) ||
       github.ref == format('refs/heads/{0}', inputs.prod-branch))
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        uses: KameshEas/gha-templates/.github/actions/resolve-version@v1
        with:
          version-variable: ${{ inputs.version-variable }}
          build-number-variable: ${{ inputs.build-number-variable }}
          github-token: ${{ secrets.VARS_PAT }}

  test_code_quality:
    name: test_code_quality
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: KameshEas/gha-templates/.github/actions/setup-flutter@v1
        with:
          ensure-env-file: ${{ inputs.ensure-env-file }}

      - name: Analyze
        continue-on-error: true
        shell: bash
        run: dart analyze

      - name: Test
        shell: bash
        run: flutter test

  # Cheap, single-ABI, minified release build -- exercises the exact signing +
  # R8/minify pass that build_firebase_apk below does, but on one architecture
  # instead of all of them. Catches keystore/signing/ProGuard misconfiguration
  # in ~3-4 min instead of waiting for the full multi-arch Firebase APK build
  # to fail on the same error. PR-time only, same as the Firebase build it guards.
  smoke_test_release_build:
    name: smoke_test_release_build
    needs: test_code_quality
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 20
    if: |
      always() &&
      (needs.test_code_quality.result == 'success' || needs.test_code_quality.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      (inputs.enable-shorebird || inputs.enable-firebase-distribution || inputs.enable-play-store)
    steps:
      - uses: actions/checkout@v4

      - if: inputs.enable-sops-secrets
        uses: KameshEas/gha-templates/.github/actions/decrypt-sops-secrets@v1
        with:
          secrets-repo: ${{ inputs.sops-secrets-repo }}
          secrets-file: ${{ inputs.sops-secrets-file }}
          ref: ${{ inputs.sops-secrets-ref }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          repo-token: ${{ secrets.CI_SECRETS_REPO_TOKEN }}

      - uses: KameshEas/gha-templates/.github/actions/setup-flutter@v1
        with:
          ensure-env-file: ${{ inputs.ensure-env-file }}

      - if: inputs.enable-google-services-json
        name: Write google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ inputs.enable-sops-secrets && env.GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          echo "google-services.json content received: ${#GOOGLE_SERVICES_JSON_CONTENT} chars"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > android/app/google-services.json
          echo "google-services.json written to disk: $(wc -c < android/app/google-services.json) bytes"
          if ! node -e 'JSON.parse(require("fs").readFileSync("android/app/google-services.json", "utf8"))' 2>/dev/null; then
            echo "WARNING: written google-services.json is not valid JSON -- compare the two lengths above to see where it broke."
          fi

      - uses: KameshEas/gha-templates/.github/actions/decode-android-keystore@v1
        with:
          keystore-filename: ${{ inputs.keystore-filename }}
          keystore-base64: ${{ inputs.enable-sops-secrets && env.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ inputs.enable-sops-secrets && env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          store-password: ${{ inputs.enable-sops-secrets && env.ANDROID_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ inputs.enable-sops-secrets && env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}

      - name: Fast single-ABI release build (smoke test)
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "❌ Keystore was not decoded (ANDROID_KEYSTORE_BASE64 secret missing or invalid)."
            exit 1
          fi

          ICON_FLAGS=""
          if [ "${{ inputs.no-tree-shake-icons }}" = "true" ]; then
            ICON_FLAGS="--no-tree-shake-icons"
          fi

          echo "🔥 Smoke-testing signing + R8/minify on a single ABI before the full Firebase build..."
          flutter build apk --release --target-platform=android-arm64 $ICON_FLAGS
          echo "✅ Smoke build passed — proceeding to the full build."

  # PR-time only: a disposable testing APK for reviewers. Whatever version is
  # currently in pubspec.yaml is fine -- Firebase doesn't enforce uniqueness,
  # and this build is never the one that ships.
  build_firebase_apk:
    name: build_firebase_apk
    needs: [test_code_quality, smoke_test_release_build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 25
    if: |
      always() &&
      (needs.test_code_quality.result == 'success' || needs.test_code_quality.result == 'skipped') &&
      (needs.smoke_test_release_build.result == 'success' || needs.smoke_test_release_build.result == 'skipped') &&
      github.event_name == 'pull_request' && inputs.enable-firebase-distribution
    steps:
      - uses: actions/checkout@v4

      - if: inputs.enable-sops-secrets
        uses: KameshEas/gha-templates/.github/actions/decrypt-sops-secrets@v1
        with:
          secrets-repo: ${{ inputs.sops-secrets-repo }}
          secrets-file: ${{ inputs.sops-secrets-file }}
          ref: ${{ inputs.sops-secrets-ref }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          repo-token: ${{ secrets.CI_SECRETS_REPO_TOKEN }}

      - uses: KameshEas/gha-templates/.github/actions/setup-flutter@v1
        with:
          ensure-env-file: ${{ inputs.ensure-env-file }}

      - if: inputs.enable-google-services-json
        name: Write google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ inputs.enable-sops-secrets && env.GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          echo "google-services.json content received: ${#GOOGLE_SERVICES_JSON_CONTENT} chars"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > android/app/google-services.json
          echo "google-services.json written to disk: $(wc -c < android/app/google-services.json) bytes"
          if ! node -e 'JSON.parse(require("fs").readFileSync("android/app/google-services.json", "utf8"))' 2>/dev/null; then
            echo "WARNING: written google-services.json is not valid JSON -- compare the two lengths above to see where it broke."
          fi

      - uses: KameshEas/gha-templates/.github/actions/decode-android-keystore@v1
        with:
          keystore-filename: ${{ inputs.keystore-filename }}
          keystore-base64: ${{ inputs.enable-sops-secrets && env.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ inputs.enable-sops-secrets && env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          store-password: ${{ inputs.enable-sops-secrets && env.ANDROID_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ inputs.enable-sops-secrets && env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "❌ Keystore was not decoded (ANDROID_KEYSTORE_BASE64 secret missing or invalid)."
            exit 1
          fi

          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //; s/"//g')
          BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$PKG_VER" | cut -d+ -f2)

          ICON_FLAGS=""
          if [ "${{ inputs.no-tree-shake-icons }}" = "true" ]; then
            ICON_FLAGS="--no-tree-shake-icons"
          fi

          echo "📱 Building Firebase testing APK (version ${BUILD_NAME}+${BUILD_NUMBER}, not a shipped version)..."
          flutter build apk \
            --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            $ICON_FLAGS

          echo ""
          echo "📦 Verifying APK..."
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "✅ APK build completed."

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.artifact-prefix }}-apk-${{ github.sha }}"
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  deploy_firebase_distribution:
    name: deploy_firebase_distribution
    needs: build_firebase_apk
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && inputs.enable-firebase-distribution
    environment: development
    steps:
      - uses: actions/checkout@v4

      - if: inputs.enable-sops-secrets
        uses: KameshEas/gha-templates/.github/actions/decrypt-sops-secrets@v1
        with:
          secrets-repo: ${{ inputs.sops-secrets-repo }}
          secrets-file: ${{ inputs.sops-secrets-file }}
          ref: ${{ inputs.sops-secrets-ref }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          repo-token: ${{ secrets.CI_SECRETS_REPO_TOKEN }}

      - uses: KameshEas/gha-templates/.github/actions/setup-flutter@v1
        with:
          restore-cache: "false"

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: "${{ inputs.artifact-prefix }}-apk-${{ github.sha }}"
          path: build/app/outputs/flutter-apk/

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: script
        env:
          FIREBASE_ANDROID_APP_ID: ${{ inputs.enable-sops-secrets && env.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_CREDENTIALS: ${{ inputs.enable-sops-secrets && env.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS || secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ inputs.enable-sops-secrets && env.FIREBASE_DISTRIBUTION_GROUPS || secrets.FIREBASE_DISTRIBUTION_GROUPS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Installing Firebase CLI..."
          npm install -g firebase-tools

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "⚠️  APK not found in build/app/outputs/flutter-apk/"
            find build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
            echo "Skipping Firebase distribution (APK optional for internal testing)"
            exit 0
          fi

          if [ -z "$FIREBASE_ANDROID_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "⚠️  Firebase variables not set, skipping Firebase distribution"
            exit 0
          fi

          mkdir -p "$HOME/.firebase"
          echo "$FIREBASE_SERVICE_ACCOUNT_CREDENTIALS" > "$HOME/.firebase/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.firebase/service-account.json"

          echo "🔎 Validating service account JSON (length ${#FIREBASE_SERVICE_ACCOUNT_CREDENTIALS} chars)..."
          if ! node -e "
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8');
            const json = JSON.parse(raw);
            for (const field of ['type', 'project_id', 'private_key', 'client_email']) {
              if (!json[field]) { console.error('Missing field: ' + field); process.exit(1); }
            }
            console.log('OK - type=' + json.type + ' project_id=' + json.project_id);
          "; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_CREDENTIALS is not valid, complete service-account JSON."
            echo "   Most likely cause: the value wasn't minified to a single line before being"
            echo "   put into the (SOPS-encrypted) dotenv file, so only a fragment got stored."
            echo "   Re-minify with: node -e \"console.log(JSON.stringify(require('./file.json')))\""
            exit 1
          fi

          RELEASE_NOTES="PR #${PR_NUMBER} - $(date '+%Y-%m-%d %H:%M:%S')"

          echo "🔥 Deploying PR #${PR_NUMBER} to Firebase for review..."

          DISTRIBUTE_ARGS=(appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --release-notes "$RELEASE_NOTES")

          if [ -n "$FIREBASE_DISTRIBUTION_GROUPS" ]; then
            DISTRIBUTE_ARGS+=(--groups "$FIREBASE_DISTRIBUTION_GROUPS")
          fi

          env -u SHELLOPTS firebase "${DISTRIBUTE_ARGS[@]}"
          echo "✅ Firebase deployment complete"

  # Builds the release AAB. Uses Shorebird when enabled (registers an
  # OTA-patchable release); otherwise a plain `flutter build appbundle`.
  # Push-only (i.e. the PR already merged) -- this is where the version
  # actually advances via resolve_version, and where Play Store deployment
  # is sourced from.
  build_release_android:
    name: build_release_android
    needs: resolve_version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 35
    if: |
      always() &&
      (needs.resolve_version.result == 'success' || needs.resolve_version.result == 'skipped') &&
      github.event_name == 'push' && (inputs.enable-shorebird || inputs.enable-play-store) &&
      (github.ref == format('refs/heads/{0}', inputs.dev-branch) ||
       github.ref == format('refs/heads/{0}', inputs.prod-branch))
    steps:
      - uses: actions/checkout@v4

      - if: inputs.enable-sops-secrets
        uses: KameshEas/gha-templates/.github/actions/decrypt-sops-secrets@v1
        with:
          secrets-repo: ${{ inputs.sops-secrets-repo }}
          secrets-file: ${{ inputs.sops-secrets-file }}
          ref: ${{ inputs.sops-secrets-ref }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          repo-token: ${{ secrets.CI_SECRETS_REPO_TOKEN }}

      - uses: KameshEas/gha-templates/.github/actions/setup-flutter@v1
        with:
          ensure-env-file: ${{ inputs.ensure-env-file }}

      - if: inputs.enable-google-services-json
        name: Write google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ inputs.enable-sops-secrets && env.GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          echo "google-services.json content received: ${#GOOGLE_SERVICES_JSON_CONTENT} chars"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > android/app/google-services.json
          echo "google-services.json written to disk: $(wc -c < android/app/google-services.json) bytes"
          if ! node -e 'JSON.parse(require("fs").readFileSync("android/app/google-services.json", "utf8"))' 2>/dev/null; then
            echo "WARNING: written google-services.json is not valid JSON -- compare the two lengths above to see where it broke."
          fi

      - if: inputs.enable-shorebird
        name: Install Shorebird
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

      - uses: KameshEas/gha-templates/.github/actions/decode-android-keystore@v1
        with:
          keystore-filename: ${{ inputs.keystore-filename }}
          keystore-base64: ${{ inputs.enable-sops-secrets && env.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ inputs.enable-sops-secrets && env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          store-password: ${{ inputs.enable-sops-secrets && env.ANDROID_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ inputs.enable-sops-secrets && env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}

      - name: Build AAB
        env:
          SHOREBIRD_TOKEN: ${{ inputs.enable-sops-secrets && env.SHOREBIRD_TOKEN || secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "❌ Keystore was not decoded (ANDROID_KEYSTORE_BASE64 secret missing or invalid)."
            exit 1
          fi

          if [ "${{ inputs.enable-auto-versioning }}" = "true" ]; then
            BUILD_NAME="${{ needs.resolve_version.outputs.version }}"
            BUILD_NUMBER="${{ needs.resolve_version.outputs.build_number }}"
          else
            PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //; s/"//g')
            BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)
            BUILD_NUMBER=$(echo "$PKG_VER" | cut -d+ -f2)
          fi
          echo "Building version ${BUILD_NAME}+${BUILD_NUMBER}"

          ICON_FLAGS=""
          if [ "${{ inputs.no-tree-shake-icons }}" = "true" ]; then
            ICON_FLAGS="--no-tree-shake-icons"
          fi

          if [ "${{ inputs.enable-shorebird }}" = "true" ]; then
            echo "🐦 Building Shorebird AAB..."
            shorebird release android \
              --build-name="$BUILD_NAME" \
              --build-number="$BUILD_NUMBER" \
              --no-confirm \
              $ICON_FLAGS
          else
            echo "📦 Building plain AAB..."
            flutter build appbundle \
              --release \
              $ICON_FLAGS \
              --build-name="$BUILD_NAME" \
              --build-number="$BUILD_NUMBER"
          fi

          echo ""
          echo "📦 Verifying AAB..."
          ls -lh build/app/outputs/bundle/release/
          test -f build/app/outputs/bundle/release/app-release.aab
          echo "✅ AAB build completed."

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.artifact-prefix }}-aab-${{ github.sha }}"
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

  deploy_google_play_internal:
    name: deploy_google_play_internal
    needs: build_release_android
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 20
    if: github.event_name == 'push' && inputs.enable-play-store && github.ref == format('refs/heads/{0}', inputs.dev-branch)
    environment: development
    steps:
      - uses: actions/checkout@v4

      - if: inputs.enable-sops-secrets
        uses: KameshEas/gha-templates/.github/actions/decrypt-sops-secrets@v1
        with:
          secrets-repo: ${{ inputs.sops-secrets-repo }}
          secrets-file: ${{ inputs.sops-secrets-file }}
          ref: ${{ inputs.sops-secrets-ref }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          repo-token: ${{ secrets.CI_SECRETS_REPO_TOKEN }}

      - uses: KameshEas/gha-templates/.github/actions/setup-flutter@v1
        with:
          restore-cache: "false"

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: "${{ inputs.artifact-prefix }}-aab-${{ github.sha }}"
          path: build/app/outputs/bundle/release/

      - name: script
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ inputs.enable-sops-secrets && env.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS || secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          PACKAGE_NAME: ${{ inputs.enable-sops-secrets && env.PACKAGE_NAME || secrets.PACKAGE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Installing Fastlane..."
          gem install fastlane -NV 2>&1 | tail -2

          AAB_PATH=$(find "$(pwd)/build/app/outputs/bundle/release" -name "*.aab" -type f | head -1)

          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB not found in build/app/outputs/bundle/release/"
            find build -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
            exit 1
          fi
          echo "✓ AAB found: $AAB_PATH"

          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "❌ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set. Add it to the GitHub Actions repository secrets."
            exit 1
          fi
          if [ -z "$PACKAGE_NAME" ]; then
            echo "❌ PACKAGE_NAME not set. Add it to the GitHub Actions repository secrets."
            exit 1
          fi

          mkdir -p ~/.android
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > ~/.android/gcloud-key.json

          # Cheap heuristic (no JSON parser guaranteed available here): a real
          # service-account file starts/ends with braces and has these fields.
          # Catches the "value wasn't minified to one line before being stored
          # in the encrypted dotenv" mistake before fastlane fails on it.
          if ! grep -q '"private_key"' ~/.android/gcloud-key.json || \
             ! grep -q '"client_email"' ~/.android/gcloud-key.json || \
             [ "$(head -c1 ~/.android/gcloud-key.json)" != "{" ]; then
            echo "❌ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS doesn't look like a complete service-account JSON (length ${#GCLOUD_SERVICE_ACCOUNT_CREDENTIALS} chars)."
            echo "   Most likely cause: the value wasn't minified to a single line before being"
            echo "   put into the (SOPS-encrypted) dotenv file, so only a fragment got stored."
            exit 1
          fi
          echo "✓ Service account credentials loaded"

          echo ""
          echo "🚀 Deploying to Google Play ${{ inputs.play-track }} track..."
          cd android

          fastlane run supply \
            aab:"$AAB_PATH" \
            track:"${{ inputs.play-track }}" \
            json_key:"$HOME/.android/gcloud-key.json" \
            package_name:"$PACKAGE_NAME" \
            skip_upload_apk:true \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            release_status:"draft"

          echo "✅ Google Play ${{ inputs.play-track }} deployment complete"

  deploy_google_play_production:
    name: deploy_google_play_production
    needs: build_release_android
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 20
    if: |
      github.event_name == 'push' && inputs.enable-play-store &&
      github.ref == format('refs/heads/{0}', inputs.prod-branch) &&
      needs.build_release_android.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - if: inputs.enable-sops-secrets
        uses: KameshEas/gha-templates/.github/actions/decrypt-sops-secrets@v1
        with:
